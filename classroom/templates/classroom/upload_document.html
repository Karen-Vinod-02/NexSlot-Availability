{% extends 'classroom/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Add Knowledge - {{ config.site_name }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="d-flex justify-content-between align-items-start mb-4">
                        <div>
                            <h1 class="h3 fw-bold mb-2">Add Knowledge</h1>
                            <p class="text-muted mb-0">Upload a PDF or TXT file to add it to the assistant's knowledge base.</p>
                        </div>
                        <a href="{% url 'classroom:dashboard' %}" class="btn btn-light rounded-pill">Back</a>
                    </div>

                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="d-grid d-sm-flex justify-content-sm-end mt-4">
                            <button type="submit" class="btn btn-primary rounded-pill px-4">
                                <i class="fas fa-robot me-2"></i>Upload and Index
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
