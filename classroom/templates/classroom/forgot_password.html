{% extends 'classroom/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Set Password{% endblock %}

{% block content %}
<div class="container d-flex flex-column align-items-center justify-content-center min-vh-100 py-5">
    <div class="col-12 col-md-6 col-lg-5 col-xl-4">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-dark">Set Password</h3>
                    <p class="text-muted small">Dev Mode: Set your password directly.</p>
                </div>

                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-success py-2 fw-semibold shadow-sm">
                            Set Password & Activate
                        </button>
                    </div>
                </form>
            </div>
            <div class="card-footer bg-light border-0 py-3 text-center">
                <a href="{% url 'classroom:login' %}" class="text-decoration-none">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
